schema: minitz.project_cell_contract/v1
product: MiniTZ OS
authority: MINITZ_OS_CURRENT_SOURCE
purpose: isolated project execution, durable continuation, and bounded remote assistance
invariants:
  - PROJECT_ISOLATION
  - ONE_PROJECT_NAMESPACE_PER_CELL
  - NO_CROSS_PROJECT_WRITES
  - NO_RAW_CREDENTIALS_IN_PROJECT_MEMORY_OR_REMOTE_CONTEXT
  - TASK_RUN_STATE_REMAINS_MINITZ_OWNED
  - PROVIDERS_AND_MACHINES_ARE_REPLACEABLE_RESOURCES
  - REMOTE_ASSISTANCE_HAS_NO_TASK_PROGRESSION_AUTHORITY
  - CACHE_AND_PROJECTIONS_HAVE_NO_CANONICAL_AUTHORITY
  - CHECKPOINTS_BIND_EXACT_PROJECT_TASK_RUN_AND_SOURCE_STATE
  - FORWARD_ONLY_CONTINUATION_UNLESS_OWNER_EXPLICITLY_ROLLS_BACK
  - UNKNOWN_REMAINS_UNKNOWN
execution:
  state_root: MINITZ_PROJECT_CELL_STATE_ROOT
  sandbox_root: MINITZ_PROJECT_SANDBOXES_ROOT
  source_root: MINITZ_SOURCE_ROOT
  normal_state_default: /var/lib/minitz/project-cells
  normal_sandbox_default: /srv/project-sandboxes
remote_assistance:
  context_rule: minimum sufficient project-scoped context only
  credential_rule: credential references only; never raw secret values
  result_rule: remote output is evidence/input until MiniTZ persists it into project state
recovery:
  rule: preserve valid project state, repair the smallest failed boundary, and resume from the newest valid checkpoint
