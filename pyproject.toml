[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "biella-engine"
version = "0.1.0"
description = "Universal, project-neutral AI production and execution engine"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
image = ["Pillow==12.1.1"]
test = ["mypy==2.3.1", "Pillow==12.1.1", "pytest==9.0.2", "setuptools==82.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
