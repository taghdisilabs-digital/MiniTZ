<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MiniTZ</title>
  <style>html,body{margin:0;min-height:100%;background:#080807;color:#f1eee5;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.loading{font:800 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:#88847b}</style>
</head>
<body>
  <div class="loading">LOADING MINITZ…</div>
  <script>
    (()=>{
      const rootPath=location.pathname==='/'||location.pathname==='/index.html';
      const target=rootPath?'/portfolio/index.html':'/live/theatre/index.html';
      fetch(target,{cache:'no-store'}).then(response=>{
        if(!response.ok)throw new Error(String(response.status));
        return response.text();
      }).then(html=>{
        document.open();document.write(html);document.close();
      }).catch(()=>{location.replace(target)});
    })();
  </script>
</body>
</html>
