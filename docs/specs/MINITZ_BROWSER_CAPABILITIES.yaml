schema: minitz.browser.capabilities/v1
product: MiniTZ Browser

purpose:
  - web_browser
  - local_computer_control
  - remote_computer_control
  - application_control
  - visual_computer_control
  - persistent_execution
  - human_visible_runtime_surface

resource_addressing:
  machine: "machine:<id>"
  browser: "browser:<id>"
  tab: "tab:<id>"
  window: "window:<id>"
  process: "process:<id>"
  terminal: "terminal:<id>"
  app: "app:<id>"
  task: "task:<id>"
  run: "run:<id>"
  artifact: "artifact:<id>"

common_request:
  target: resource_id
  operation: string
  arguments: object
  task_id: optional
  run_id: optional

common_result:
  action_id: string
  target: resource_id
  operation: string
  status:
    - running
    - succeeded
    - failed
    - cancelled
  result: object
  changed_state: object
  evidence: []
  started_at: timestamp
  finished_at: timestamp

