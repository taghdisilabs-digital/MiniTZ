execution_model:

  persistent_sessions:
    - terminal
    - process
    - browser
    - screen_stream
    - automation
    - search
    - watcher
    - task
    - run

  interaction_priority:
    - native_capability
    - structured_application_api
    - browser_dom
    - accessibility
    - visual_semantic_target
    - raw_gui_coordinates
    - shell_fallback

  state_model:
    restore_previous_machine_state: true
    refresh_changed_scope_only: true
    preserve_processes_across_model_turns: true
    preserve_terminal_sessions_across_model_turns: true
    preserve_browser_sessions_across_model_turns: true
    preserve_downloads_across_model_turns: true

  context_model:
    full_history_per_action: false
    use_current_projection: true
    use_targeted_retrieval: true
    use_live_delta: true
    raw_logs_on_demand: true

  observation_model:
    raw_result: preserved
    normalized_state: updated
    evidence_linked: true

browser_modes:

  web:
    capabilities:
      - browser.*

  computer:
    capabilities:
      - machine.*
      - filesystem
      - search
      - terminal
      - command
      - process
      - service
      - application
      - window
      - display
      - screen
      - gui
      - clipboard
      - storage
      - network
      - gpu
      - audio
      - camera

  remote_computer:
    capabilities:
      - remote
      - transfer
      - terminal
      - filesystem
      - process
      - application
      - screen
      - gui

  work:
    capabilities:
      - project
      - task
      - run
      - action
      - artifact
      - evidence
      - history
      - automation

ui_surfaces:
  - web_page
  - computer_screen
  - files
  - applications
  - terminal
  - processes
  - downloads
  - projects
  - tasks
  - runs
  - artifacts
  - evidence
  - machines

required_property:
  MiniTZ_Browser: >
    One browser surface capable of operating websites, the local machine,
    remote machines, files, terminals, processes, applications, graphical
    interfaces, projects, tasks, runs and evidence through structured
    persistent MiniTZ capabilities.
