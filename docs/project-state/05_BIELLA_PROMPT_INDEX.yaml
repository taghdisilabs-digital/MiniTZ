resolution_algorithm:
  input: active_prompt_id
  steps:
    - read active prompt from 04_MINITZ_ACTIVE_TASK.md and confirm against 03_MINITZ_CURRENT_STATE.md
    - lookup exact Drive ID here
    - fetch exact prompt body
    - read technical dependencies from exact prompt and current accepted interfaces
    - verify numbered predecessor is durably closed
    - execute only active numbered prompt
  forbidden:
    - infer prompt body from title
    - treat numbered_predecessor as technical dependency
    - invent technical dependencies not present in exact prompt/current source
    - load all prompt bodies
    - use this index as completion evidence
