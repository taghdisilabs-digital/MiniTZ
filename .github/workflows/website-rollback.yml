name: Website Rollback Proof
on:
  workflow_dispatch:
    inputs:
      target_version_id:
        description: Cloudflare Worker version to restore
        required: true
      expected_source_commit:
        description: Source commit embedded in target version deployment.json
        required: true
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: website-production
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - name: Roll back exact Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TARGET_VERSION_ID"
          npx --yes wrangler@4 rollback "$TARGET_VERSION_ID" --message "Biella website rollback proof" 2>&1 | tee rollback.txt
      - name: Verify production now serves target source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          curl -fsS --max-time 20 https://biellagames.dev/deployment.json -o rollback-readback.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('rollback-readback.json'))
          assert x['source_commit'] == os.environ['EXPECTED_SOURCE_COMMIT']
          assert x['environment'] == 'PRODUCTION'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: website-rollback-evidence-${{ github.run_id }}
          path: |
            website/rollback.txt
            website/rollback-readback.json
