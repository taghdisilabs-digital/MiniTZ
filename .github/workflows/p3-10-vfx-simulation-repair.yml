name: P3-10 VFX Simulation Repair

on:
  push:
    branches: [main]
    paths:
      - "src/biella/vfx_pack.py"
      - "src/biella/simulation_tool.py"
      - "src/biella/vfx_recovery.py"
      - "tests/test_p3_10_vfx_pack.py"
      - "tests/test_p3_10_enospc_recovery.py"
      - ".github/workflows/p3-10-vfx-simulation-repair.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Focused contract and ENOSPC recovery tests
        run: python -m pytest tests/test_p3_10_vfx_pack.py tests/test_p3_10_enospc_recovery.py -q
      - name: Strict typecheck
        run: python -m mypy src/biella/vfx_pack.py src/biella/vfx_recovery.py
      - name: Compile
        run: python -m compileall -q src/biella
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Emit P3-10 ENOSPC recovery evidence
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path
          from biella.vfx_recovery import VerifiedSimulationSegment, plan_resource_exhaustion_recovery
          spec = "a" * 64
          plan = plan_resource_exhaustion_recovery(
              specification_digest=spec,
              frame_start=1,
              frame_end=300,
              failed_frame=237,
              failure_reason="ENOSPC: no space left on device while writing frame 237 cache",
              verified_segments=(
                  VerifiedSimulationSegment(spec, 1, 100, "artifact://p/checkpoint-100/1", "b" * 64, "natt_" + "1" * 32, 1),
                  VerifiedSimulationSegment(spec, 101, 200, "artifact://p/checkpoint-200/1", "c" * 64, "natt_" + "2" * 32, 1),
              ),
              dispatchable_frames=range(201, 301),
          )
          payload = plan.evidence_payload()
          payload["p3_10_kpis"] = {
              "simulation_cache_used_as_only_authority": 0,
              "verified_segments_lost_after_failure": 0,
              "incompatible_checkpoint_resumes": 0,
              "dependent_solver_steps_parallelized_incorrectly": 0,
              "global_GPU_requirement_for_VFX": 0,
          }
          payload["reality_classification"] = {
              "enospc_1_300_recovery_path": "REAL_DETERMINISTIC_CONTRACT",
              "blender_runtime_in_ci": "NOT_RUN",
          }
          Path("dist").mkdir(exist_ok=True)
          target = Path("dist/p3_10_enospc_recovery_evidence.json")
          target.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"evidence_sha256": hashlib.sha256(target.read_bytes()).hexdigest(), **payload}, sort_keys=True))
          PY
