name: P3-10 VFX Simulation Repair

on:
  push:
    branches: [main]
    paths:
      - "src/biella/vfx_pack.py"
      - "src/biella/simulation_tool.py"
      - "src/biella/_blender_simulation_driver.py"
      - "src/biella/vfx_recovery.py"
      - "tests/test_p3_10_vfx_pack.py"
      - "tests/test_p3_10_enospc_recovery.py"
      - "tests/test_p3_10_vfx_real.py"
      - "tests/test_p3_10_durable_evidence.py"
      - ".github/workflows/p3-10-vfx-simulation-repair.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Focused contract, recovery, and durable-import tests
        run: >-
          python -m pytest -q
          tests/test_p3_10_vfx_pack.py
          tests/test_p3_10_enospc_recovery.py
          tests/test_p3_10_durable_evidence.py
      - name: Strict typecheck
        run: >-
          python -m mypy --strict
          src/biella/vfx_pack.py
          src/biella/simulation_tool.py
          src/biella/_blender_simulation_driver.py
          src/biella/vfx_recovery.py
          tests/test_p3_10_enospc_recovery.py
          tests/test_p3_10_vfx_real.py
          tests/test_p3_10_durable_evidence.py
      - name: Compile
        run: python -m compileall -q src/biella
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
