name: P3-12 Audio Production Repair

on:
  push:
    branches: [main]
    paths:
      - "src/biella/audio_pack.py"
      - "src/biella/audio_tool.py"
      - "src/biella/cloudflare_audio_model.py"
      - "tests/test_p3_12_audio_pack.py"
      - "tests/test_p3_12_audio_real.py"
      - "tests/test_p3_12_audio_model.py"
      - "tests/test_p3_12_durable_evidence.py"
      - "docs/project-state/03_BIELLA_CURRENT_STATE.md"
      - "docs/project-state/04_BIELLA_ACTIVE_TASK.md"
      - "docs/project-state/evidence/P3_12_AUDIO_PRODUCTION_REPAIR_EVIDENCE.md"
      - ".github/workflows/p3-12-audio-production-repair.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and FFmpeg build dependencies
        run: |
          python -m pip install -e ".[test]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl libmp3lame-dev nasm pkg-config xz-utils yasm
      - name: Build exact FFmpeg 8.0.1 runtime
        run: |
          curl --fail --location --silent --show-error https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz -o /tmp/ffmpeg-8.0.1.tar.xz
          sha256sum /tmp/ffmpeg-8.0.1.tar.xz
          tar -xJf /tmp/ffmpeg-8.0.1.tar.xz -C /tmp
          cd /tmp/ffmpeg-8.0.1
          ./configure --disable-doc --disable-debug --disable-ffplay --enable-gpl --enable-libmp3lame
          make -j2 ffmpeg ffprobe
          sudo install -m 0755 ffmpeg /usr/bin/ffmpeg
          sudo install -m 0755 ffprobe /usr/bin/ffprobe
      - name: Verify exact audio runtime identity
        run: |
          test "$(ffmpeg -version | head -n 1 | awk '{print $3}')" = "8.0.1"
          test "$(ffprobe -version | head -n 1 | awk '{print $3}')" = "8.0.1"
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          sha256sum /usr/bin/ffmpeg /usr/bin/ffprobe
      - name: Provide non-executed P3-05 scheduler support fixtures
        run: |
          cat > /tmp/p3-12-nonexecuted-tool <<'SH'
          #!/bin/sh
          echo "P3-12 audio evidence must not execute this scheduler fixture" >&2
          exit 97
          SH
          chmod 0755 /tmp/p3-12-nonexecuted-tool
          sudo install -m 0755 /tmp/p3-12-nonexecuted-tool /usr/bin/blender
          sudo install -m 0755 /tmp/p3-12-nonexecuted-tool /usr/bin/bwrap
          sudo mkdir -p /usr/lib/blender/scripts/addons_core/io_scene_gltf2
          printf '%s\n' '# P3-12 non-executed scheduler fixture' | sudo tee /usr/lib/blender/scripts/addons_core/io_scene_gltf2/__init__.py >/dev/null
      - name: P3-12 audio contract, real runtime, provider boundary, and retained importer tests
        run: python -m pytest tests/test_p3_12_audio_pack.py tests/test_p3_12_audio_real.py tests/test_p3_12_audio_model.py tests/test_p3_12_durable_evidence.py -q
      - name: Strict typecheck
        run: python -m mypy src/biella/audio_pack.py src/biella/audio_tool.py src/biella/cloudflare_audio_model.py
      - name: Compile
        run: python -m compileall -q src/biella
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Emit P3-12 evidence summary
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess
          from pathlib import Path
          files = [
              Path("src/biella/audio_pack.py"),
              Path("src/biella/audio_tool.py"),
              Path("src/biella/cloudflare_audio_model.py"),
              Path("tests/test_p3_12_audio_pack.py"),
              Path("tests/test_p3_12_audio_real.py"),
              Path("tests/test_p3_12_audio_model.py"),
          ]
          ffmpeg = Path("/usr/bin/ffmpeg")
          ffprobe = Path("/usr/bin/ffprobe")
          ffmpeg_identity = subprocess.check_output([str(ffmpeg), "-version"], text=True).splitlines()[0]
          ffprobe_identity = subprocess.check_output([str(ffprobe), "-version"], text=True).splitlines()[0]
          wheels = sorted(Path("dist").glob("*.whl"))
          payload = {
              "task": "P3-12",
              "source_sha256": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
              "runtime_identity": {
                  "ffmpeg": ffmpeg_identity,
                  "ffmpeg_sha256": hashlib.sha256(ffmpeg.read_bytes()).hexdigest(),
                  "ffprobe": ffprobe_identity,
                  "ffprobe_sha256": hashlib.sha256(ffprobe.read_bytes()).hexdigest(),
              },
              "wheel_sha256": {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in wheels},
              "kpi_authority": "NOT_CLAIMED_BY_CI; RETAINED_REAL_ENGINE_EVIDENCE_REQUIRED",
              "reality_classification": {
                  "deterministic_decode_edit_mix_validation": "REAL_FFMPEG_8_0_1",
                  "p3_05_scheduler_support_paths": "NON_EXECUTED_FIXTURE",
                  "provider_contract_and_corrupt_output_rejection": "REFERENCE_ADAPTER_TEST",
                  "external_cloudflare_audio_generation_in_ci": "NOT_RUN",
              },
          }
          encoded = (json.dumps(payload, indent=2, sort_keys=True) + "\n").encode()
          Path("dist").mkdir(exist_ok=True)
          target = Path("dist/p3_12_audio_production_evidence.json")
          target.write_bytes(encoded)
          print(json.dumps({"evidence_sha256": hashlib.sha256(encoded).hexdigest(), **payload}, sort_keys=True))
          PY
      - name: Upload P3-12 wheel and bounded CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: p3-12-audio-production-ci
          path: |
            dist/*.whl
            dist/p3_12_audio_production_evidence.json
          if-no-files-found: error
