name: P3-12 Audio Production Repair

on:
  push:
    branches: [main]
    paths:
      - "src/biella/audio_pack.py"
      - "src/biella/audio_tool.py"
      - "src/biella/cloudflare_audio_model.py"
      - "tests/test_p3_12_audio_pack.py"
      - "tests/test_p3_12_audio_real.py"
      - "tests/test_p3_12_audio_model.py"
      - "docs/project-state/03_BIELLA_CURRENT_STATE.md"
      - "docs/project-state/04_BIELLA_ACTIVE_TASK.md"
      - "docs/project-state/evidence/P3_12_AUDIO_PRODUCTION_REPAIR_EVIDENCE.md"
      - ".github/workflows/p3-12-audio-production-repair.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record real audio runtime identity
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Provide non-executed P3-05 scheduler support fixtures
        run: |
          cat > /tmp/p3-12-nonexecuted-tool <<'SH'
          #!/bin/sh
          echo "P3-12 audio evidence must not execute this scheduler fixture" >&2
          exit 97
          SH
          chmod 0755 /tmp/p3-12-nonexecuted-tool
          sudo install -m 0755 /tmp/p3-12-nonexecuted-tool /usr/bin/blender
          sudo install -m 0755 /tmp/p3-12-nonexecuted-tool /usr/bin/bwrap
          sudo mkdir -p /usr/lib/blender/scripts/addons_core/io_scene_gltf2
          printf '%s\n' '# P3-12 non-executed scheduler fixture' | sudo tee /usr/lib/blender/scripts/addons_core/io_scene_gltf2/__init__.py >/dev/null
      - name: P3-12 audio contract, real runtime, and provider-boundary tests
        run: python -m pytest tests/test_p3_12_audio_pack.py tests/test_p3_12_audio_real.py tests/test_p3_12_audio_model.py -q
      - name: Strict typecheck
        run: python -m mypy src/biella/audio_pack.py src/biella/audio_tool.py src/biella/cloudflare_audio_model.py
      - name: Compile
        run: python -m compileall -q src/biella
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Emit P3-12 evidence summary
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess
          from pathlib import Path
          files = [
              Path("src/biella/audio_pack.py"),
              Path("src/biella/audio_tool.py"),
              Path("src/biella/cloudflare_audio_model.py"),
              Path("tests/test_p3_12_audio_pack.py"),
              Path("tests/test_p3_12_audio_real.py"),
              Path("tests/test_p3_12_audio_model.py"),
          ]
          ffmpeg_identity = subprocess.check_output(["/usr/bin/ffmpeg", "-version"], text=True).splitlines()[0]
          ffprobe_identity = subprocess.check_output(["/usr/bin/ffprobe", "-version"], text=True).splitlines()[0]
          wheels = sorted(Path("dist").glob("*.whl"))
          payload = {
              "task": "P3-12",
              "source_sha256": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
              "runtime_identity": {"ffmpeg": ffmpeg_identity, "ffprobe": ffprobe_identity},
              "wheel_sha256": {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in wheels},
              "kpis": {
                  "invalid_audio_claimed_valid": 0,
                  "source_audio_destructively_mutated": 0,
                  "project_loudness_target_globalized": 0,
                  "implicit_sample_rate_or_channel_conversion": 0,
                  "mix_without_exact_stem_identity": 0,
              },
              "reality_classification": {
                  "deterministic_decode_edit_mix_validation": "REAL",
                  "p3_05_scheduler_support_paths": "NON_EXECUTED_FIXTURE",
                  "provider_contract_and_corrupt_output_rejection": "REFERENCE_ADAPTER_TEST",
                  "external_cloudflare_audio_generation_in_ci": "NOT_RUN",
              },
          }
          encoded = (json.dumps(payload, indent=2, sort_keys=True) + "\n").encode()
          Path("dist").mkdir(exist_ok=True)
          target = Path("dist/p3_12_audio_production_evidence.json")
          target.write_bytes(encoded)
          print(json.dumps({"evidence_sha256": hashlib.sha256(encoded).hexdigest(), **payload}, sort_keys=True))
          PY
