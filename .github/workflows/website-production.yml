name: Website Production Deployment
on:
  push:
    branches: [website-production]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    environment: website-production
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Bind exact source tree
        run: echo "BIELLA_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
        working-directory: .
      - run: npm run build
        env:
          BIELLA_SOURCE_COMMIT: ${{ github.sha }}
          BIELLA_SOURCE_TREE: ${{ env.BIELLA_SOURCE_TREE }}
          BIELLA_SOURCE_BRANCH: website-production
          BIELLA_DEPLOY_ENV: PRODUCTION
          BIELLA_DEPLOYMENT_STATUS: PRODUCTION_DEPLOYED
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --message "BU production ${GITHUB_SHA}" 2>&1 | tee production-deployment.txt
      - name: Production readback
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 https://biellagames.dev/deployment.json -o production-readback.json; then break; fi
            sleep 10
          done
          test -s production-readback.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('production-readback.json'))
          assert x['source_commit'] == os.environ['GITHUB_SHA']
          assert x['source_tree'] == os.environ['BIELLA_SOURCE_TREE']
          assert x['environment'] == 'PRODUCTION'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: website-production-evidence-${{ github.sha }}
          path: |
            website/production-deployment.txt
            website/production-readback.json
